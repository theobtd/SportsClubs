<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Club | PlayLocal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm mb-8">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-indigo-600">PlayLocal 🏆</h1>
            <span class="bg-indigo-100 text-indigo-800 text-sm font-bold px-3 py-1 rounded-full">Admin Portal</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-bold mb-2">Add a New Club</h2>
            <p class="text-slate-500 mb-8">Fill out the details below to add a new sport club to the database.</p>

            <!-- Success/Error Messages -->
            <div id="statusMessage" class="hidden mb-6 p-4 rounded-lg font-medium text-sm"></div>

            <form id="addClubForm" class="space-y-6">
                
                <!-- Basic Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Club Name *</label>
                        <input type="text" id="name" required placeholder="e.g. Venice Beach Soccer" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Sport *</label>
                        <select id="sport" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Select a sport...</option>
                            <!-- Populated via JS -->
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Category</label>
                        <select id="category" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Mixed">Mixed</option>
                            <option value="Mens">Mens</option>
                            <option value="Womens">Womens</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Price *</label>
                        <input type="text" id="price" required placeholder="e.g. Free, $10, £5" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Location Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">City *</label>
                        <input type="text" id="city" required placeholder="e.g. Los Angeles" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Venue Location *</label>
                        <input type="text" id="location" required placeholder="e.g. Venice Community Grounds" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Latitude (Map Pin) *</label>
                        <input type="number" step="any" id="lat" required placeholder="e.g. 34.0522" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Longitude (Map Pin) *</label>
                        <input type="number" step="any" id="lng" required placeholder="e.g. -118.2437" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Timing & Details -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Day of Week *</label>
                        <select id="day" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Time *</label>
                        <input type="text" id="time" required placeholder="e.g. 10:00 AM" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">First Session Detail</label>
                        <input type="text" id="trialTime" required placeholder="e.g. Saturdays @ 10:00 AM" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">What to Bring</label>
                        <input type="text" id="bring" required placeholder="e.g. Water bottle and cleats." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Description</label>
                    <textarea id="description" rows="4" required placeholder="A brief description of the club, skill level, and vibe..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-4 rounded-xl transition-colors shadow-md shadow-indigo-200 text-lg flex items-center justify-center">
                    <span>Add Club to Map</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        // 1. Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyAs4CT_5LESnO8JQUAMBx1wqt9k21eL3oY",
            authDomain: "sportsclubs-986c3.firebaseapp.com",
            projectId: "sportsclubs-986c3",
            storageBucket: "sportsclubs-986c3.firebasestorage.app",
            messagingSenderId: "998457987275",
            appId: "1:998457987275:web:f926a0fe0339633e1acb4e",
            measurementId: "G-SQJ7H4JYK2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Populate Sport Dropdown (Ensures consistency with your map colors)
        const sportsList = [
            "Touch Rugby", "Rugby", "Soccer", "Lacrosse", "Volleyball", 
            "Beach Volleyball", "Field Hockey", "Padel", "Tennis", "Squash", 
            "Badminton", "Rowing", "Archery", "Dancing", "Boxing", "AFL"
        ];
        
        const sportSelect = document.getElementById('sport');
        sportsList.sort().forEach(sport => {
            const option = document.createElement('option');
            option.value = sport;
            option.textContent = sport;
            sportSelect.appendChild(option);
        });

        // 3. Form Submission Logic
        const form = document.getElementById('addClubForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        function showMessage(text, isError = false) {
            statusMessage.textContent = text;
            statusMessage.className = `mb-6 p-4 rounded-lg font-medium text-sm ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            statusMessage.classList.remove('hidden');
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload

            // Change button state
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Saving...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

            // Gather data from inputs
            // Note: lat and lng MUST be numbers for the map to work properly, so we use parseFloat
            const clubData = {
                name: document.getElementById('name').value.trim(),
                sport: document.getElementById('sport').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value.trim(),
                city: document.getElementById('city').value.trim(),
                location: document.getElementById('location').value.trim(),
                lat: parseFloat(document.getElementById('lat').value),
                lng: parseFloat(document.getElementById('lng').value),
                day: document.getElementById('day').value,
                time: document.getElementById('time').value.trim(),
                trialTime: document.getElementById('trialTime').value.trim(),
                bring: document.getElementById('bring').value.trim(),
                description: document.getElementById('description').value.trim()
            };

            try {
                // Add to Firestore collection 'clubs'
                await db.collection('clubs').add(clubData);
                
                // Show success
                showMessage('Success! Club added to the map.');
                
                // Clear the form for the next entry
                form.reset();
                
            } catch (error) {
                console.error("Error adding document: ", error);
                
                // If they forgot to update rules, give them a specific warning
                if(error.code === 'permission-denied') {
                    showMessage('Permission Denied! Make sure you temporarily updated your Firestore Rules to "allow write: if true;".', true);
                } else {
                    showMessage('Error adding club: ' + error.message, true);
                }
            } finally {
                // Reset button state
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                
                // Scroll back to top to see message
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
