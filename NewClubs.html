<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Clubs | PlayLocal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs (Auth, Firestore, and Storage) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 opacity-0 transition-opacity duration-300" id="mainBody">

    <!-- Header -->
    <header class="bg-white shadow-sm mb-8">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-indigo-600">PlayLocal 🏆</h1>
            <div class="flex items-center space-x-4">
                <span class="bg-indigo-100 text-indigo-800 text-sm font-bold px-3 py-1 rounded-full hidden md:inline-block">Admin Portal</span>
                <button id="signOutBtn" class="text-sm font-bold text-slate-500 hover:text-slate-800">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
            
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-6">
                <div>
                    <h2 id="formTitle" class="text-2xl font-bold mb-2">Add a New Club</h2>
                    <p id="formSubtitle" class="text-slate-500">Fill out the details below to add a new sport club to the database.</p>
                </div>
                
                <!-- NEW: Club Selector for Editing -->
                <div class="mt-4 md:mt-0 md:w-64">
                    <select id="clubSelector" class="w-full bg-slate-100 border border-slate-200 text-sm font-semibold rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors cursor-pointer">
                        <option value="">+ Create New Club</option>
                        <!-- Existing clubs will be loaded here -->
                    </select>
                </div>
            </div>

            <div id="statusMessage" class="hidden mb-6 p-4 rounded-lg font-medium text-sm"></div>

            <form id="addClubForm" class="space-y-6">
                
                <!-- Basic Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Club Name *</label>
                        <input type="text" id="name" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Sport *</label>
                        <select id="sport" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Select a sport...</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Category</label>
                        <select id="category" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Mixed">Mixed</option>
                            <option value="Mens">Mens</option>
                            <option value="Womens">Womens</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Price *</label>
                        <input type="text" id="price" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-slate-200 disabled:text-slate-500 disabled:cursor-not-allowed transition-colors">
                        
                        <label class="inline-flex items-center mt-3 cursor-pointer">
                            <input type="checkbox" id="isFree" class="sr-only peer">
                            <div class="relative w-9 h-5 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-indigo-500 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                            <span class="ml-2 text-sm font-medium text-slate-700">Set as Free</span>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Skill Level *</label>
                        <select id="skillLevel" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="" disabled selected>Select a skill level...</option>
                            <option value="Any">Any</option>
                            <option value="Beginner-friendly">Beginner-friendly</option>
                            <option value="Intermediate and above">Intermediate and above</option>
                        </select>
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Location Info -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">City *</label>
                        <select id="city" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Select a city...</option>
                            <option value="Hong Kong">Hong Kong</option>
                            <option value="Amsterdam">Amsterdam</option>
                            <option value="London">London</option>
                            <option value="New York City">New York City</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Venue Location *</label>
                        <input type="text" id="location" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Latitude (Map Pin) *</label>
                        <input type="number" step="any" id="lat" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Longitude (Map Pin) *</label>
                        <input type="number" step="any" id="lng" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Timing & Details -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Day of Week *</label>
                        <select id="day" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Time *</label>
                        <select id="time" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Select a time...</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">First Session Detail</label>
                        <input type="text" id="trialTime" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">What to Bring</label>
                        <input type="text" id="bring" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Description</label>
                    <textarea id="description" rows="4" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>

                <hr class="border-slate-100">

                <!-- Contact & Socials -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Website</label>
                        <input type="url" id="website" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
                        <input type="email" id="email" placeholder="hello@club.com" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+1 234 567 8900" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Instagram Link</label>
                        <input type="url" id="instagram" placeholder="https://instagram.com/..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Facebook Page Link</label>
                        <input type="url" id="facebook" placeholder="https://facebook.com/..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Media Uploads -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Club Thumbnail Image</label>
                        <input type="file" id="imageFile" accept="image/*" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <p class="text-xs text-slate-500 mt-1 file-hint">Upload a clear photo to represent the club.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Presentation Video</label>
                        <input type="file" id="videoFile" accept="video/*" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <p class="text-xs text-slate-500 mt-1 file-hint">Upload a short video showcasing the club.</p>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-4 rounded-xl transition-colors shadow-md shadow-indigo-200 text-lg">
                    Add Club to Map
                </button>
            </form>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAs4CT_5LESnO8JQUAMBx1wqt9k21eL3oY",
            authDomain: "sportsclubs-986c3.firebaseapp.com",
            projectId: "sportsclubs-986c3",
            storageBucket: "sportsclubs-986c3.firebasestorage.app",
            messagingSenderId: "998457987275",
            appId: "1:998457987275:web:f926a0fe0339633e1acb4e",
            measurementId: "G-SQJ7H4JYK2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // --- NEW: STATE MANAGEMENT ---
        let currentEditId = null; 
        let clubsDataMap = {}; // Stores fetched clubs for quick population

        // --- AUTHENTICATION GUARD ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('mainBody').classList.remove('opacity-0');
                loadExistingClubs(); // Load clubs once authenticated
            } else {
                window.location.replace('AdminLogin.html');
            }
        });

        document.getElementById('signOutBtn').addEventListener('click', () => {
            auth.signOut();
        });

        // --- FORM SETUP LOGIC ---
        
        // Populate Sports List
        const sportsList = [
            "Touch Rugby", "Rugby", "Soccer", "Lacrosse", "Volleyball", 
            "Beach Volleyball", "Field Hockey", "Padel", "Tennis", "Squash", 
            "Badminton", "Rowing", "Archery", "Dancing", "Boxing", "AFL"
        ];
        
        const sportSelect = document.getElementById('sport');
        sportsList.sort().forEach(sport => {
            const option = document.createElement('option');
            option.value = sport;
            option.textContent = sport;
            sportSelect.appendChild(option);
        });

        // Populate Time List
        const timeSelect = document.getElementById('time');
        for (let hour = 6; hour <= 22; hour++) {
            ['00', '30'].forEach(minute => {
                const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
                const ampm = hour >= 12 ? 'PM' : 'AM';
                const timeString = `${displayHour}:${minute} ${ampm}`;
                const option = document.createElement('option');
                option.value = timeString;
                option.textContent = timeString;
                timeSelect.appendChild(option);
            });
        }

        // --- PRICE TOGGLE LOGIC ---
        const priceInput = document.getElementById('price');
        const isFreeCheckbox = document.getElementById('isFree');

        isFreeCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                priceInput.value = 'Free';
                priceInput.disabled = true;
            } else {
                priceInput.value = '';
                priceInput.disabled = false;
                priceInput.focus();
            }
        });

        // --- FETCH & POPULATE EXISTING CLUBS ---
        async function loadExistingClubs() {
            try {
                const snapshot = await db.collection('clubs').get();
                const selector = document.getElementById('clubSelector');
                
                // Keep only the "Create New" default option
                selector.innerHTML = '<option value="">+ Create New Club</option>';
                clubsDataMap = {};

                snapshot.forEach(doc => {
                    const data = doc.data();
                    clubsDataMap[doc.id] = data;
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.textContent = `${data.name} (${data.city})`;
                    selector.appendChild(option);
                });
            } catch (error) {
                console.error("Error loading clubs:", error);
            }
        }

        // Handle Dropdown Change (Switching between Add / Edit)
        document.getElementById('clubSelector').addEventListener('change', (e) => {
            const clubId = e.target.value;
            currentEditId = clubId || null;

            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const submitBtn = document.getElementById('submitBtn');
            const fileHints = document.querySelectorAll('.file-hint');
            const form = document.getElementById('addClubForm');

            if (currentEditId && clubsDataMap[currentEditId]) {
                const club = clubsDataMap[currentEditId];
                
                // Update UI text for Editing
                formTitle.textContent = 'Edit Club';
                formSubtitle.textContent = `Updating information for ${club.name}`;
                submitBtn.textContent = 'Update Club Information';
                submitBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
                submitBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-700');
                submitBtn.classList.replace('shadow-indigo-200', 'shadow-emerald-200');
                
                // Let the user know they don't have to re-upload files to keep them
                fileHints.forEach(hint => hint.textContent = "Leave blank to keep existing media.");

                // Populate Fields
                document.getElementById('name').value = club.name || '';
                document.getElementById('sport').value = club.sport || '';
                document.getElementById('category').value = club.category || 'Mixed';
                
                if (club.price === 'Free') {
                    isFreeCheckbox.checked = true;
                    priceInput.value = 'Free';
                    priceInput.disabled = true;
                } else {
                    isFreeCheckbox.checked = false;
                    priceInput.value = club.price || '';
                    priceInput.disabled = false;
                }
                
                document.getElementById('skillLevel').value = club.skillLevel || '';
                document.getElementById('city').value = club.city || '';
                document.getElementById('location').value = club.location || '';
                document.getElementById('lat').value = club.lat || '';
                document.getElementById('lng').value = club.lng || '';
                document.getElementById('day').value = club.day || '';
                document.getElementById('time').value = club.time || '';
                document.getElementById('trialTime').value = club.trialTime || '';
                document.getElementById('bring').value = club.bring || '';
                document.getElementById('description').value = club.description || '';
                document.getElementById('website').value = club.website || '';
                document.getElementById('email').value = club.email || '';
                document.getElementById('phone').value = club.phone || '';
                document.getElementById('instagram').value = club.instagram || '';
                document.getElementById('facebook').value = club.facebook || '';

                // Clear file inputs programmatically
                document.getElementById('imageFile').value = '';
                document.getElementById('videoFile').value = '';

            } else {
                // Reset to Create Mode
                formTitle.textContent = 'Add a New Club';
                formSubtitle.textContent = 'Fill out the details below to add a new sport club to the database.';
                submitBtn.textContent = 'Add Club to Map';
                submitBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
                submitBtn.classList.replace('hover:bg-emerald-700', 'hover:bg-indigo-700');
                submitBtn.classList.replace('shadow-emerald-200', 'shadow-indigo-200');

                fileHints[0].textContent = "Upload a clear photo to represent the club.";
                fileHints[1].textContent = "Upload a short video showcasing the club.";
                
                form.reset();
                priceInput.disabled = false;
            }
        });

        const form = document.getElementById('addClubForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');

        function showMessage(text, isError = false) {
            statusMessage.textContent = text;
            statusMessage.className = `mb-6 p-4 rounded-lg font-medium text-sm ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
            statusMessage.classList.remove('hidden');
            setTimeout(() => statusMessage.classList.add('hidden'), 5000);
        }

        async function uploadFile(file, folderPath) {
            if (!file) return null;
            const fileName = `${folderPath}/${Date.now()}_${file.name}`;
            const storageRef = storage.ref(fileName);
            const snapshot = await storageRef.put(file);
            return await snapshot.ref.getDownloadURL();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Saving Data...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                const imageFile = document.getElementById('imageFile').files[0];
                const videoFile = document.getElementById('videoFile').files[0];

                // If editing, start with existing URLs. If adding, start with null.
                let imageUrl = currentEditId ? clubsDataMap[currentEditId].imageUrl : null;
                let videoUrl = currentEditId ? clubsDataMap[currentEditId].videoUrl : null;

                const uploadPromises = [];
                
                if (imageFile) {
                    uploadPromises.push(uploadFile(imageFile, 'club_images').then(url => imageUrl = url));
                }
                if (videoFile) {
                    uploadPromises.push(uploadFile(videoFile, 'club_videos').then(url => videoUrl = url));
                }

                if (uploadPromises.length > 0) {
                    submitBtn.innerHTML = 'Uploading Media...';
                    await Promise.all(uploadPromises);
                }

                const clubData = {
                    name: document.getElementById('name').value.trim(),
                    sport: document.getElementById('sport').value,
                    category: document.getElementById('category').value,
                    price: isFreeCheckbox.checked ? 'Free' : priceInput.value.trim(),
                    skillLevel: document.getElementById('skillLevel').value,
                    city: document.getElementById('city').value,
                    location: document.getElementById('location').value.trim(),
                    lat: parseFloat(document.getElementById('lat').value),
                    lng: parseFloat(document.getElementById('lng').value),
                    day: document.getElementById('day').value,
                    time: document.getElementById('time').value,
                    trialTime: document.getElementById('trialTime').value.trim(),
                    bring: document.getElementById('bring').value.trim(),
                    description: document.getElementById('description').value.trim(),
                    website: document.getElementById('website').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    instagram: document.getElementById('instagram').value.trim(),
                    facebook: document.getElementById('facebook').value.trim(),
                    imageUrl: imageUrl || '', 
                    videoUrl: videoUrl || ''
                };

                // Decide whether to Update or Add
                if (currentEditId) {
                    await db.collection('clubs').doc(currentEditId).update(clubData);
                    showMessage('Success! Club information updated.');
                } else {
                    await db.collection('clubs').add(clubData);
                    showMessage('Success! New club added to the database.');
                    form.reset();
                    priceInput.disabled = false;
                }

                // Refresh the list so the dropdown gets any new names/clubs
                await loadExistingClubs();
                
                // Re-select the currently edited club if we were in edit mode
                if (currentEditId) {
                    document.getElementById('clubSelector').value = currentEditId;
                }

            } catch (error) {
                console.error("Error saving document: ", error);
                showMessage('Error saving club: ' + error.message, true);
            } finally {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
