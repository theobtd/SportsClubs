<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | PlayLocal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">PlayLocal 🏆</h1>
            <p class="text-slate-500 font-medium">Admin Portal Login</p>
        </div>

        <div id="errorMessage" class="hidden mb-6 p-4 rounded-lg font-medium text-sm bg-red-50 text-red-700 border border-red-200"></div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                <input type="email" id="email" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                <input type="password" id="password" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors shadow-md shadow-indigo-200 mt-4">
                Sign In
            </button>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAs4CT_5LESnO8JQUAMBx1wqt9k21eL3oY",
            authDomain: "sportsclubs-986c3.firebaseapp.com",
            projectId: "sportsclubs-986c3",
            storageBucket: "sportsclubs-986c3.firebasestorage.app",
            messagingSenderId: "998457987275",
            appId: "1:998457987275:web:f926a0fe0339633e1acb4e",
            measurementId: "G-SQJ7H4JYK2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            loginBtn.innerHTML = 'Signing in...';
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-70');
            errorMessage.classList.add('hidden');

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Redirect on success
                window.location.href = 'NewClubs.html';
            } catch (error) {
                errorMessage.textContent = 'Invalid email or password. Please try again.';
                errorMessage.classList.remove('hidden');
                
                loginBtn.innerHTML = 'Sign In';
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-70');
            }
        });
    </script>
</body>
</html>
