<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLocal | Discover Amateur Sports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .video-placeholder { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=600&q=80') center/cover; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-md z-20 relative">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-indigo-600">PlayLocal 🏆</h1>
            
            <!-- Filter Controls -->
            <div class="flex space-x-3">
                <select id="sportFilter" class="bg-slate-100 border-none rounded-lg px-3 py-2 font-semibold text-sm md:text-base cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="All">All Sports</option>
                    <!-- Options injected via JS -->
                </select>

                <select id="cityFilter" class="bg-slate-100 border-none rounded-lg px-3 py-2 font-semibold text-sm md:text-base cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Global">Global View</option>
                    <option value="Los Angeles">Los Angeles</option>
                    <option value="London">London</option>
                    <option value="Amsterdam">Amsterdam</option>
                    <option value="Hong Kong">Hong Kong</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex relative overflow-hidden">
        
        <!-- Map Container -->
        <div id="map" class="w-full h-full z-0"></div>

        <!-- Slide-out Side Panel -->
        <div id="sidePanel" class="absolute md:relative right-0 top-0 h-full w-full md:w-[400px] bg-white shadow-2xl transform translate-x-full md:translate-x-0 transition-transform duration-300 z-10 flex flex-col">
            
            <!-- Close Button -->
            <button id="closePanel" class="hidden absolute top-4 right-4 bg-white/80 p-2 rounded-full shadow hover:bg-white z-20">
                <svg class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Default Empty State -->
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-gradient-to-br from-slate-50 to-indigo-50/50">
                <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-teal-500 mb-4 leading-tight tracking-tight">
                    Your city is your playground.
                </h2>
                <p class="text-slate-500 font-medium text-lg">
                    Tap a pin on the map to find your team.
                </p>
            </div>

            <!-- Panel Content -->
            <div id="panelContent" class="hidden overflow-y-auto flex-1 pb-8"></div>
        </div>

    </main>

    <!-- Application Logic -->
    <script>
        // 1. Configuration & Styling
        const sportColors = {
            "Touch Rugby": "#d946ef", "Rugby": "#8b5cf6", "Soccer": "#ef4444", 
            "Lacrosse": "#f97316", "Volleyball": "#facc15", "Beach Volleyball": "#eab308", 
            "Field Hockey": "#84cc16", "Padel": "#22c55e", "Tennis": "#14b8a6", 
            "Squash": "#06b6d4", "Badminton": "#0ea5e9", "Rowing": "#3b82f6", 
            "Archery": "#6366f1", "Dancing": "#ec4899", "Boxing": "#f43f5e", 
            "AFL": "#64748b"
        };

        const cityCoords = {
            "Global": [30, 0],
            "Los Angeles": [34.0522, -118.2437],
            "London": [51.5074, -0.1278],
            "Amsterdam": [52.3676, 4.9041],
            "Hong Kong": [22.3193, 114.1694]
        };

        // 2. Mock Data Generator (Creates 15 clubs per city)
        const generateMockClubs = () => {
            const generated = [];
            const citiesData = {
                "Los Angeles": { lat: 34.0522, lng: -118.2437, hoods: ["Santa Monica", "Silver Lake", "Downtown", "Echo Park", "Venice Beach"] },
                "London": { lat: 51.5074, lng: -0.1278, hoods: ["Clapham", "Hyde Park", "Hackney", "Battersea", "Regent's Park"] },
                "Amsterdam": { lat: 52.3676, lng: 4.9041, hoods: ["Vondelpark", "De Pijp", "Oud-West", "Zuidas", "Noord"] },
                "Hong Kong": { lat: 22.3193, lng: 114.1694, hoods: ["Happy Valley", "Victoria Park", "Kowloon", "Repulse Bay", "Wan Chai"] }
            };

            const sports = Object.keys(sportColors);
            const suffixes = ["Social", "Collective", "Club", "Beginners", "Academy", "Crew"];
            
            Object.keys(citiesData).forEach(cityName => {
                const city = citiesData[cityName];
                for (let i = 0; i < 15; i++) {
                    const sport = sports[Math.floor(Math.random() * sports.length)];
                    const hood = city.hoods[Math.floor(Math.random() * city.hoods.length)];
                    const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
                    
                    // Scatter pins randomly within ~5-10km of the city center
                    const latOffset = (Math.random() - 0.5) * 0.15;
                    const lngOffset = (Math.random() - 0.5) * 0.15;

                    generated.push({
                        name: `${hood} ${sport} ${suffix}`,
                        sport: sport,
                        city: cityName,
                        category: ["Mixed", "Womens", "Mens"][Math.floor(Math.random() * 3)],
                        lat: city.lat + latOffset,
                        lng: city.lng + lngOffset,
                        trialTime: ["Saturdays @ 10:00 AM", "Sundays @ 9:00 AM", "Tuesdays @ 6:30 PM", "Thursdays @ 7:00 PM"][Math.floor(Math.random() * 4)],
                        price: ["$10", "£8", "€12", "$15", "Free"][Math.floor(Math.random() * 5)],
                        bring: "Comfortable athletic wear, a water bottle, and good vibes. All equipment is provided!",
                        location: `${hood} Community Grounds`,
                        description: `Always wanted to try ${sport} but felt intimidated? Our beginner group in ${hood} is specifically designed for zero-experience adults. It's a fantastic workout and a highly supportive team environment. We focus on fun, learning the basics, and we usually grab drinks or food together after the session!`
                    });
                }
            });
            return generated;
        };

        const clubs = generateMockClubs();

        // 3. Initialize UI & Map
        
        // Populate Sport Dropdown
        const sportFilter = document.getElementById('sportFilter');
        Object.keys(sportColors).forEach(sport => {
            const option = document.createElement('option');
            option.value = sport;
            option.textContent = sport;
            sportFilter.appendChild(option);
        });

        // Initialize Map
        const map = L.map('map', { zoomControl: false }).setView([30, 0], 2);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const markersGroup = L.layerGroup().addTo(map);

        // Panel Elements
        const sidePanel = document.getElementById('sidePanel');
        const emptyState = document.getElementById('emptyState');
        const panelContent = document.getElementById('panelContent');
        const closePanelBtn = document.getElementById('closePanel');

        // 4. Render & Interaction Logic
        function renderMarkers() {
            markersGroup.clearLayers();
            
            const selectedCity = document.getElementById('cityFilter').value;
            const selectedSport = document.getElementById('sportFilter').value;

            clubs.forEach(club => {
                const matchesCity = selectedCity === "Global" || club.city === selectedCity;
                const matchesSport = selectedSport === "All" || club.sport === selectedSport;

                if (matchesCity && matchesSport) {
                    const dotColor = sportColors[club.sport];
                    
                    const marker = L.circleMarker([club.lat, club.lng], {
                        radius: 10,
                        fillColor: dotColor,
                        color: "#ffffff", 
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(markersGroup);
                    
                    marker.on('click', () => {
                        openPanel(club);
                        map.flyTo([club.lat, club.lng], 14, { duration: 1 }); 
                    });
                }
            });
        }

        function openPanel(club) {
            sidePanel.classList.remove('translate-x-full');
            emptyState.classList.add('hidden');
            closePanelBtn.classList.remove('hidden');
            panelContent.classList.remove('hidden');
            
            panelContent.innerHTML = `
                <div class="h-64 relative video-placeholder flex items-center justify-center cursor-pointer group">
                    <div class="w-16 h-16 bg-white/90 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform shadow-lg">
                        <svg class="w-8 h-8 text-indigo-600 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                    </div>
                    <span class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-2 py-1 rounded font-semibold">0:30</span>
                </div>
                
                <div class="p-6">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider" style="color: ${sportColors[club.sport]}">${club.sport} • ${club.category}</span>
                        <span class="text-sm font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full">${club.price}</span>
                    </div>
                    <h2 class="text-2xl font-extrabold mb-2">${club.name}</h2>
                    <p class="text-slate-500 text-sm mb-6">📍 ${club.location}, ${club.city}</p>
                    
                    <p class="text-slate-600 text-base leading-relaxed mb-6">${club.description}</p>
                    
                    <div class="bg-indigo-50 p-4 rounded-xl mb-6 border border-indigo-100">
                        <h4 class="font-bold text-indigo-900 mb-2">First Session Info</h4>
                        <p class="text-sm text-indigo-800 mb-2"><strong>🗓️ When:</strong> ${club.trialTime}</p>
                        <p class="text-sm text-indigo-800"><strong>🎒 Bring:</strong> ${club.bring}</p>
                    </div>
                    
                    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors shadow-md shadow-indigo-200">
                        Book Intro Session
                    </button>
                </div>
            `;
        }

        function resetPanel() {
            sidePanel.classList.add('translate-x-full');
            emptyState.classList.remove('hidden');
            closePanelBtn.classList.add('hidden');
            panelContent.classList.add('hidden');
            panelContent.innerHTML = '';
        }

        closePanelBtn.addEventListener('click', resetPanel);

        document.getElementById('cityFilter').addEventListener('change', (e) => {
            const city = e.target.value;
            const zoomLevel = city === "Global" ? 2 : 11;
            map.flyTo(cityCoords[city], zoomLevel, { duration: 1.5 });
            resetPanel(); 
            renderMarkers(); 
        });

        document.getElementById('sportFilter').addEventListener('change', () => {
            resetPanel();
            renderMarkers(); 
        });

        // Initial render
        renderMarkers();
    </script>
</body>
</html>
