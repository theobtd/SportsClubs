<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayLocal | Discover Amateur Sports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .video-placeholder { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=600&q=80') center/cover; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-md z-20 relative">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-indigo-600">PlayLocal 🏆</h1>
            
            <!-- Filter Controls -->
            <div class="flex space-x-3 items-center">
                
                <!-- Sport Filter -->
                <select id="sportFilter" class="bg-slate-100 border-none rounded-lg px-3 py-2 font-semibold text-sm md:text-base cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="All">All Sports</option>
                    <!-- Options injected via JS -->
                </select>

                <!-- Skill Level Filter -->
                <select id="skillFilter" class="bg-slate-100 border-none rounded-lg px-3 py-2 font-semibold text-sm md:text-base cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Any">Any Skill Level</option>
                    <option value="Beginner-friendly">Beginner-friendly</option>
                    <option value="Intermediate and above">Intermediate and above</option>
                </select>

                <!-- Days Filter -->
                <details class="relative">
                    <summary class="bg-slate-100 border-none rounded-lg px-3 py-2 font-semibold text-sm md:text-base cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500 list-none [&::-webkit-details-marker]:hidden flex items-center select-none">
                        Days ▾
                    </summary>
                    <div class="absolute right-0 top-full mt-2 bg-white shadow-xl rounded-lg p-3 min-w-[150px] border border-slate-100 z-50">
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="Saturday" class="day-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">Saturday</span>
                        </label>
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="Sunday" class="day-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">Sunday</span>
                        </label>
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="Tuesday" class="day-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">Tuesday</span>
                        </label>
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="Thursday" class="day-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">Thursday</span>
                        </label>
                    </div>
                </details>

                <!-- Times Filter -->
                <details class="relative">
                    <summary class="bg-slate-100 border-none rounded-lg px-3 py-2 font-semibold text-sm md:text-base cursor-pointer outline-none focus:ring-2 focus:ring-indigo-500 list-none [&::-webkit-details-marker]:hidden flex items-center select-none">
                        Times ▾
                    </summary>
                    <div class="absolute right-0 top-full mt-2 bg-white shadow-xl rounded-lg p-3 min-w-[150px] border border-slate-100 z-50">
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="09:00 AM" class="time-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">09:00 AM</span>
                        </label>
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="10:00 AM" class="time-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">10:00 AM</span>
                        </label>
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="06:30 PM" class="time-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">06:30 PM</span>
                        </label>
                        <label class="flex items-center space-x-2 py-1.5 cursor-pointer hover:bg-slate-50 px-2 rounded">
                            <input type="checkbox" value="07:00 PM" class="time-cb w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="text-sm font-medium">07:00 PM</span>
                        </label>
                    </div>
                </details>
                
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex relative overflow-hidden">
        
        <!-- Map Container -->
        <div id="map" class="w-full h-full z-0"></div>

        <!-- Slide-out Side Panel -->
        <div id="sidePanel" class="absolute md:relative right-0 top-0 h-full w-full md:w-[400px] bg-white shadow-2xl transform translate-x-full md:translate-x-0 transition-transform duration-300 z-10 flex flex-col">
            
            <!-- Close Button -->
            <button id="closePanel" class="hidden absolute top-4 right-4 bg-white/80 p-2 rounded-full shadow hover:bg-white z-20">
                <svg class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Default Empty State -->
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center p-8 text-center bg-gradient-to-br from-slate-50 to-indigo-50/50">
                <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-teal-500 mb-4 leading-tight tracking-tight">
                    Hong Kong is your playground.
                </h2>
                <p class="text-slate-500 font-medium text-lg">
                    Tap a pin on the map to find your team.
                </p>
            </div>

            <!-- Panel Content -->
            <div id="panelContent" class="hidden overflow-y-auto flex-1 pb-8"></div>
        </div>

    </main>

    <!-- Application Logic -->
    <script>
        // 1. Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyAs4CT_5LESnO8JQUAMBx1wqt9k21eL3oY",
            authDomain: "sportsclubs-986c3.firebaseapp.com",
            projectId: "sportsclubs-986c3",
            storageBucket: "sportsclubs-986c3.firebasestorage.app",
            messagingSenderId: "998457987275",
            appId: "1:998457987275:web:f926a0fe0339633e1acb4e",
            measurementId: "G-SQJ7H4JYK2"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let clubs = [];

        // 2. Configuration & Styling
        const sportColors = {
            "Touch Rugby": "#d946ef", "Rugby": "#8b5cf6", "Soccer": "#ef4444", 
            "Lacrosse": "#f97316", "Volleyball": "#facc15", "Beach Volleyball": "#eab308", 
            "Field Hockey": "#84cc16", "Padel": "#22c55e", "Tennis": "#14b8a6", 
            "Squash": "#06b6d4", "Badminton": "#0ea5e9", "Rowing": "#3b82f6", 
            "Archery": "#6366f1", "Dancing": "#ec4899", "Boxing": "#f43f5e", 
            "AFL": "#64748b"
        };

        // Populate Sport Dropdown
        const sportFilter = document.getElementById('sportFilter');
        Object.keys(sportColors).forEach(sport => {
            const option = document.createElement('option');
            option.value = sport;
            option.textContent = sport;
            sportFilter.appendChild(option);
        });

        // Initialize Map directly zoomed into Hong Kong
        const map = L.map('map', { zoomControl: false }).setView([22.3193, 114.1694], 11);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const markersGroup = L.layerGroup().addTo(map);

        const sidePanel = document.getElementById('sidePanel');
        const emptyState = document.getElementById('emptyState');
        const panelContent = document.getElementById('panelContent');
        const closePanelBtn = document.getElementById('closePanel');

        function renderMarkers() {
            markersGroup.clearLayers();
            
            const selectedSport = document.getElementById('sportFilter').value;
            const selectedSkill = document.getElementById('skillFilter').value;
            
            const selectedDays = Array.from(document.querySelectorAll('.day-cb:checked')).map(cb => cb.value);
            const selectedTimes = Array.from(document.querySelectorAll('.time-cb:checked')).map(cb => cb.value);

            clubs.forEach(club => {
                // Hardcoded to only render if the club is based in Hong Kong
                const matchesCity = club.city === "Hong Kong";
                const matchesSport = selectedSport === "All" || club.sport === selectedSport;
                // Check if the skill matches (assumes database field is `club.skillLevel`)
                const matchesSkill = selectedSkill === "Any" || club.skillLevel === selectedSkill;
                const matchesDay = selectedDays.length === 0 || selectedDays.includes(club.day);
                const matchesTime = selectedTimes.length === 0 || selectedTimes.includes(club.time);

                if (matchesCity && matchesSport && matchesSkill && matchesDay && matchesTime) {
                    const dotColor = sportColors[club.sport] || "#333333";
                    
                    const marker = L.circleMarker([club.lat, club.lng], {
                        radius: 10,
                        fillColor: dotColor,
                        color: "#ffffff", 
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(markersGroup);
                    
                    marker.on('click', () => {
                        openPanel(club);
                        map.flyTo([club.lat, club.lng], 14, { duration: 1 }); 
                    });
                }
            });
        }

        function openPanel(club) {
            sidePanel.classList.remove('translate-x-full');
            emptyState.classList.add('hidden');
            closePanelBtn.classList.remove('hidden');
            panelContent.classList.remove('hidden');
            
            const dotColor = sportColors[club.sport] || "#333333";
        
            const hasVideo = club.videoUrl && club.videoUrl.trim() !== '';
            const hasImage = club.imageUrl && club.imageUrl.trim() !== '';
        
            // Determine Media HTML
            let mediaHtml = '';
            
            if (hasVideo && hasImage) {
                // Both exist: Render the Thumbnail Facade
                mediaHtml = `
                    <div id="video-facade" class="h-64 relative bg-slate-100 group cursor-pointer overflow-hidden">
                        <img src="${club.imageUrl}" alt="${club.name}" class="w-full h-full object-cover">
                        <!-- Play Button Overlay -->
                        <div class="absolute inset-0 bg-black/30 flex items-center justify-center transition-all group-hover:bg-black/40">
                            <div class="w-16 h-16 bg-white/90 rounded-full flex items-center justify-center shadow-lg transform group-hover:scale-110 transition-transform duration-200">
                                <svg class="w-8 h-8 text-indigo-600 ml-1" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>
                `;
            } else if (hasVideo) {
                // Only Video
                mediaHtml = `
                    <div class="h-64 relative bg-black">
                        <video src="${club.videoUrl}" controls class="w-full h-full object-cover"></video>
                    </div>
                `;
            } else if (hasImage) {
                // Only Image
                mediaHtml = `
                    <div class="h-64 relative bg-slate-100">
                        <img src="${club.imageUrl}" alt="${club.name}" class="w-full h-full object-cover">
                    </div>
                `;
            } else {
                // Neither (Placeholder)
                mediaHtml = `
                    <div class="h-64 relative video-placeholder flex items-center justify-center">
                        <span class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-2 py-1 rounded font-semibold">PlayLocal</span>
                    </div>
                `;
            }
        
            panelContent.innerHTML = `
                ${mediaHtml}
                
                <div class="p-6">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider" style="color: ${dotColor}">${club.sport} • ${club.category}</span>
                        <span class="text-sm font-bold bg-green-100 text-green-700 px-3 py-1 rounded-full">${club.price}</span>
                    </div>
                    <h2 class="text-2xl font-extrabold mb-2">${club.name}</h2>
                    <p class="text-slate-500 text-sm mb-6">📍 ${club.location}, ${club.city}</p>
                    
                    <p class="text-slate-600 text-base leading-relaxed mb-6">${club.description}</p>
                    
                    <div class="bg-indigo-50 p-4 rounded-xl mb-6 border border-indigo-100">
                        <h4 class="font-bold text-indigo-900 mb-2">First Session Info</h4>
                        <p class="text-sm text-indigo-800 mb-2"><strong>🗓️ When:</strong> ${club.trialTime}</p>
                        <p class="text-sm text-indigo-800"><strong>🎒 Bring:</strong> ${club.bring}</p>
                        <p class="text-sm text-indigo-800 mt-2"><strong>📊 Level:</strong> ${club.skillLevel || 'Any'}</p>
                    </div>
                    
                    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition-colors shadow-md shadow-indigo-200">
                        Book Intro Session
                    </button>
                </div>
            `;
        
            // Add event listener to swap facade with actual video
            if (hasVideo && hasImage) {
                const facade = document.getElementById('video-facade');
                if (facade) {
                    facade.addEventListener('click', function() {
                        this.outerHTML = `
                            <div class="h-64 relative bg-black">
                                <video src="${club.videoUrl}" controls autoplay class="w-full h-full object-cover"></video>
                            </div>
                        `;
                    });
                }
            }
        }

        function resetPanel() {
            sidePanel.classList.add('translate-x-full');
            emptyState.classList.remove('hidden');
            closePanelBtn.classList.add('hidden');
            panelContent.classList.add('hidden');
            panelContent.innerHTML = '';
        }

        // Event listeners
        document.querySelectorAll('.day-cb, .time-cb').forEach(cb => {
            cb.addEventListener('change', () => {
                resetPanel();
                renderMarkers();
            });
        });

        closePanelBtn.addEventListener('click', resetPanel);

        document.getElementById('sportFilter').addEventListener('change', () => {
            resetPanel();
            renderMarkers(); 
        });

        // Add event listener for the new skill filter
        document.getElementById('skillFilter').addEventListener('change', () => {
            resetPanel();
            renderMarkers(); 
        });

        // Fetch Data from Firebase
        async function fetchClubs() {
            try {
                const snapshot = await db.collection('clubs').get();
                
                clubs = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                renderMarkers();
            } catch (error) {
                console.error("Error fetching clubs from Firebase: ", error);
            }
        }

        fetchClubs();
    </script>
</body>
</html>
